# 收件匣中繼資料範本(複製到 _inbox/<代號>/meta.yml 後填寫)
# 上傳對話會讀這個檔,自動產生 notes.md / 更新 README / commit + push。
# 規劃對話只需填這份 + 放好 HTML 檔,不要碰 git。

代號: muan                       # 英文小寫 3–10 字,不含空格/底線/中文。即資料夾名與網址路徑
類型: 新案                       # 「新案」或「更新」
客戶名稱: 沐恩動物醫院            # 中文客戶名(新案必填;更新可省略)
聯絡人: 林文傑                   # (新案必填;更新可省略)
email: jakelinvet@gmail.com      # (新案必填;更新可省略)
版本: v1                         # 例 v1 / v2 / v2.1
日期: 2026-05-20                 # YYYY-MM-DD
狀態: 進行中                     # 預設「進行中」(新案用;更新可省略)

變更摘要:                        # 1–N 點,條列這版做了什麼
  - 首版提案

# 檔案說明(可選):每個 HTML 一行,會寫進 notes.md。
# index.html 為必備落地頁,且須在頁面內以相對連結指向其他 HTML。
檔案說明:
  index.html: 提案說明與導覽(落地頁)
  wireframe.html: 可點擊的互動式 Wireframe 原型
